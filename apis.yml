aid: aalo-atomics
name: Aalo Atomics
description: 'Aalo Atomics is an Austin, Texas-based advanced nuclear engineering company,
  founded in 2021, working to make reactor deployment fast, repeatable, and economical
  through factory manufacturing. It is developing the Aalo-1, a factory-fabricated
  sodium-cooled microreactor (~10 MWe class), and Aalo Pod power plants that combine
  five Aalo-1 reactors to deliver roughly 50 megawatts of electricity for data centers,
  industrial facilities, and communities. The company describes a new XMR ("extra
  modular reactor") category, has raised a $100M Series B, and is advancing through
  U.S. Nuclear Regulatory Commission pre-application activities and a U.S. Department
  of Energy experimental microreactor site in Idaho. This API Evangelist profile tracks
  Aalo Atomics as a company in the network; the company does not currently publish
  a public developer API.'
